name: Build Desktop App

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build forge binary
        run: python3 src/build_forge.py

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: electron/package.json

      - name: Install Electron dependencies
        run: npm install
        working-directory: electron

      # Clean any stale dist/ artifacts from prior runs — prevents electron-builder
      # from publishing old latest*.yml files that reference renamed/missing assets.
      - name: Clean dist
        run: rm -rf electron/dist

      - name: Build desktop app (macOS)
        if: runner.os == 'macOS'
        run: npm run build:mac -- --publish never
        working-directory: electron
        # Code signing: add CSC_LINK + CSC_KEY_PASSWORD secrets when Apple Developer cert is ready
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false   # skip signing until cert is configured

      - name: Build desktop app (Windows)
        if: runner.os == 'Windows'
        run: npm run build:win -- --publish never
        working-directory: electron
        # Code signing: add WIN_CSC_LINK + WIN_CSC_KEY_PASSWORD secrets when EV cert is ready
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # Non-tag builds: upload as workflow artifacts for testing/QA (14-day retention)
      - name: Upload build artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: forge-os-${{ runner.os }}
          retention-days: 14
          path: |
            electron/dist/*.dmg
            electron/dist/*.exe
            electron/dist/*.zip
            electron/dist/latest*.yml

      # Tag builds: publish to GitHub Releases so electron-updater can detect new versions.
      # CRITICAL: latest*.yml MUST be included — electron-updater reads these files to
      # determine whether the installed version is outdated. Without them, auto-update
      # checks will silently find "no update available" even when a newer release exists.
      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            electron/dist/*.dmg
            electron/dist/*.exe
            electron/dist/*.zip
            electron/dist/latest*.yml
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-beta') || contains(github.ref, '-rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
