name: Build Desktop App

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Runs on every main push. Reads the version from package.json and checks
  # whether a GitHub Release already exists for it. If not, the build and
  # publish jobs will produce and publish a new release automatically.
  check-version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: echo "version=v$(node -p "require('./desktop/package.json').version")" >> $GITHUB_OUTPUT

      - name: Check if release exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "${{ steps.ver.outputs.version }}" &>/dev/null 2>&1; then
            echo "should_release=false" >> $GITHUB_OUTPUT
            echo "Release ${{ steps.ver.outputs.version }} already exists — skipping publish."
          else
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "No release for ${{ steps.ver.outputs.version }} — will build and publish."
          fi

  build:
    # On main push: always build (artifacts for QA + potential release).
    # On tag push or manual dispatch: always build.
    needs: [check-version]
    if: always() && (needs.check-version.result == 'skipped' || needs.check-version.result == 'success')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build forge binary
        run: python3 src/build_forge.py

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: desktop/package.json

      - name: Install Electron dependencies
        run: npm install
        working-directory: desktop

      # Clean any stale dist/ artifacts from prior runs — prevents electron-builder
      # from publishing old latest*.yml files that reference renamed/missing assets.
      # shell: bash required — rm -rf is not valid in PowerShell on Windows runners.
      - name: Clean dist
        shell: bash
        run: rm -rf desktop/dist

      - name: Build desktop app (macOS)
        if: runner.os == 'macOS'
        run: |
          if [ -n "${{ secrets.CSC_LINK }}" ]; then
            export CSC_LINK="${{ secrets.CSC_LINK }}"
            export CSC_KEY_PASSWORD="${{ secrets.CSC_KEY_PASSWORD }}"
          fi
          # Build each architecture in a separate invocation to avoid pkg target
          # temp-file collisions observed when electron-builder packages both
          # macOS arch targets in one run.
          npm run build:mac -- --publish never --arm64
          npm run build:mac -- --publish never --x64
        working-directory: desktop
        env:
          # Signing: set CSC_LINK (base64 .p12) + CSC_KEY_PASSWORD to enable code signing.
          # Notarization: set APPLE_ID, APPLE_ID_PASSWORD (app-specific), APPLE_TEAM_ID.
          # Until secrets are configured the app builds unsigned — users must run:
          #   xattr -cr "/Applications/Forge OS.app"
          CSC_IDENTITY_AUTO_DISCOVERY: false
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build desktop app (Windows)
        if: runner.os == 'Windows'
        run: npm run build:win -- --publish never
        working-directory: desktop
        # Code signing: add WIN_CSC_LINK + WIN_CSC_KEY_PASSWORD secrets when EV cert is ready
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Build desktop app (Linux)
        if: runner.os == 'Linux'
        run: npm run build:linux -- --publish never
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # Upload build artifacts for QA on branch builds and for release publishing on tag builds.
      - name: Upload build artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: forge-os-${{ runner.os }}
          retention-days: 14
          overwrite: true
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.pkg
            desktop/dist/*.zip
            desktop/dist/latest*.yml

      - name: Upload build artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: forge-os-${{ runner.os }}
          retention-days: 14
          overwrite: true
          path: |
            desktop/dist/*.exe
            desktop/dist/latest*.yml

      - name: Upload build artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: forge-os-${{ runner.os }}
          retention-days: 14
          overwrite: true
          path: |
            desktop/dist/*.AppImage
            desktop/dist/latest-linux.yml

  publish:
    # Publish on tag push, or on main push when a new version is detected.
    if: |
      always() &&
      needs.build.result == 'success' &&
      (
        startsWith(github.ref, 'refs/tags/') ||
        needs.check-version.outputs.should_release == 'true'
      )
    needs: [check-version, build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Resolve release tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ needs.check-version.outputs.version }}" >> $GITHUB_OUTPUT
          fi

      # Tag builds: publish to GitHub Releases so electron-updater can detect new versions.
      # CRITICAL: latest*.yml MUST be included — electron-updater reads these files to
      # determine whether the installed version is outdated.
      - name: Publish to GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          prerelease_args=()
          if [[ "$tag" == *-beta* || "$tag" == *-rc* ]]; then
            prerelease_args=(--prerelease)
          fi

          mapfile -t files < <(find release-artifacts -type f | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release artifacts found."
            exit 1
          fi

          gh release delete "$tag" --yes || true
          gh release create "$tag" "${files[@]}" --title "$tag" --generate-notes "${prerelease_args[@]}"

      # Create the git tag if this was triggered by a main push (not a tag push).
      # Uses the GitHub API — GITHUB_TOKEN is sufficient for creating refs.
      - name: Create git tag (if auto-release)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          gh api repos/$GH_REPO/git/refs \
            -f ref="refs/tags/$tag" \
            -f sha="${{ github.sha }}" || echo "Tag may already exist, continuing."
