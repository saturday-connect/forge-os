name: Build Desktop App

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build forge binary
        run: python3 src/build_forge.py

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: desktop/package.json

      - name: Install Electron dependencies
        run: npm install
        working-directory: desktop

      # Clean any stale dist/ artifacts from prior runs — prevents electron-builder
      # from publishing old latest*.yml files that reference renamed/missing assets.
      # shell: bash required — rm -rf is not valid in PowerShell on Windows runners.
      - name: Clean dist
        shell: bash
        run: rm -rf desktop/dist

      - name: Build desktop app (macOS)
        if: runner.os == 'macOS'
        run: |
          if [ -n "${{ secrets.CSC_LINK }}" ]; then
            export CSC_LINK="${{ secrets.CSC_LINK }}"
            export CSC_KEY_PASSWORD="${{ secrets.CSC_KEY_PASSWORD }}"
          fi
          # Build each architecture in a separate invocation to avoid pkg target
          # temp-file collisions observed when electron-builder packages both
          # macOS arch targets in one run.
          npm run build:mac -- --publish never --arm64
          npm run build:mac -- --publish never --x64
        working-directory: desktop
        env:
          # Signing: set CSC_LINK (base64 .p12) + CSC_KEY_PASSWORD to enable code signing.
          # Notarization: set APPLE_ID, APPLE_ID_PASSWORD (app-specific), APPLE_TEAM_ID.
          # Until secrets are configured the app builds unsigned — users must run:
          #   xattr -cr "/Applications/Forge OS.app"
          CSC_IDENTITY_AUTO_DISCOVERY: false
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build desktop app (Windows)
        if: runner.os == 'Windows'
        run: npm run build:win -- --publish never
        working-directory: desktop
        # Code signing: add WIN_CSC_LINK + WIN_CSC_KEY_PASSWORD secrets when EV cert is ready
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Build desktop app (Linux)
        if: runner.os == 'Linux'
        run: npm run build:linux -- --publish never
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # Non-tag builds: upload as workflow artifacts for testing/QA (14-day retention)
      - name: Upload build artifact (macOS)
        if: ${{ !startsWith(github.ref, 'refs/tags/') && runner.os == 'macOS' }}
        uses: actions/upload-artifact@v4
        with:
          name: forge-os-${{ runner.os }}
          retention-days: 14
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.pkg
            desktop/dist/*.zip
            desktop/dist/latest*.yml

      - name: Upload build artifact (Windows)
        if: ${{ !startsWith(github.ref, 'refs/tags/') && runner.os == 'Windows' }}
        uses: actions/upload-artifact@v4
        with:
          name: forge-os-${{ runner.os }}
          retention-days: 14
          path: |
            desktop/dist/*.exe
            desktop/dist/latest*.yml

      - name: Upload build artifact (Linux)
        if: ${{ !startsWith(github.ref, 'refs/tags/') && runner.os == 'Linux' }}
        uses: actions/upload-artifact@v4
        with:
          name: forge-os-${{ runner.os }}
          retention-days: 14
          path: |
            desktop/dist/*.AppImage
            desktop/dist/latest-linux.yml

      # Tag builds: publish to GitHub Releases so electron-updater can detect new versions.
      # CRITICAL: latest*.yml MUST be included — electron-updater reads these files to
      # determine whether the installed version is outdated. Without them, auto-update
      # checks will silently find "no update available" even when a newer release exists.
      - name: Publish to GitHub Releases (macOS)
        if: ${{ startsWith(github.ref, 'refs/tags/') && runner.os == 'macOS' }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/dist/*.dmg
            desktop/dist/*.pkg
            desktop/dist/*.zip
            desktop/dist/latest*.yml
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-beta') || contains(github.ref, '-rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Releases (Windows)
        if: ${{ startsWith(github.ref, 'refs/tags/') && runner.os == 'Windows' }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/dist/*.exe
            desktop/dist/latest*.yml
          generate_release_notes: false
          draft: false
          prerelease: ${{ contains(github.ref, '-beta') || contains(github.ref, '-rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Releases (Linux)
        if: ${{ startsWith(github.ref, 'refs/tags/') && runner.os == 'Linux' }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/dist/*.AppImage
            desktop/dist/latest-linux.yml
          generate_release_notes: false
          draft: false
          prerelease: ${{ contains(github.ref, '-beta') || contains(github.ref, '-rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
