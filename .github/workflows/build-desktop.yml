name: Build Desktop App

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build forge binary
        run: python3 src/build_forge.py

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: electron/package.json

      - name: Install Electron dependencies
        run: npm install
        working-directory: electron

      - name: Build desktop app (macOS)
        if: runner.os == 'macOS'
        run: npm run build:mac -- --publish never
        working-directory: electron
        # TODO: add CSC_LINK and CSC_KEY_PASSWORD secrets for code signing before public release

      - name: Build desktop app (Windows)
        if: runner.os == 'Windows'
        run: npm run build:win -- --publish never
        working-directory: electron
        # TODO: add WIN_CSC_LINK and WIN_CSC_KEY_PASSWORD for Authenticode signing

      - name: Upload build artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: forge-os-${{ runner.os }}
          retention-days: 14
          path: |
            electron/dist/*.dmg
            electron/dist/*.exe
            electron/dist/*.zip
            electron/dist/latest*.yml

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            electron/dist/*.dmg
            electron/dist/*.exe
            electron/dist/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
