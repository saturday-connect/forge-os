<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connect GitHub Account</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #060D06;
      --surface: rgba(255,255,255,0.04);
      --surface-2: rgba(255,255,255,0.06);
      --border: rgba(255,255,255,0.08);
      --text: #ffffff;
      --text-muted: rgba(255,255,255,0.55);
      --text-subtle: rgba(255,255,255,0.25);
      --accent: #4ADE80;
      --accent-hover: #6EE79A;
      --accent-subtle: rgba(74,222,128,0.1);
      --blue: #0EA5E9;
      --blue-subtle: rgba(14,165,233,0.1);
      --error: #F87171;
      --error-subtle: rgba(248,113,113,0.1);
      --success: #4ADE80;
      --warning: #F59E0B;
      --radius: 12px;
      --radius-sm: 8px;
    }

    html, body {
      height: 100%;
      background: #060D06;
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      line-height: 1.5;
      user-select: none;
      -webkit-app-region: drag;
    }

    /* macOS hiddenInset: traffic lights occupy ~38px at top */
    html.mac .container { padding-top: 44px; }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 28px 32px;
      gap: 20px;
    }

    .screen { display: none; width: 100%; }
    .screen.active { display: contents; }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo-icon {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
    }
    .logo-wordmark {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.85);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    h1 {
      font-size: 17px;
      font-weight: 600;
      color: #ffffff;
      text-align: center;
    }

    .instruction {
      font-size: 13px;
      color: rgba(255,255,255,0.55);
      text-align: center;
    }

    .code-block {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 14px 28px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      -webkit-app-region: no-drag;
    }

    .code-value {
      font-family: "SFMono-Regular", "SF Mono", Menlo, Monaco, Consolas, monospace;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: #4ADE80;
    }

    .btn-copy {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 9999px;
      color: rgba(255,255,255,0.5);
      font-size: 12px;
      padding: 4px 10px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
      -webkit-app-region: no-drag;
    }
    .btn-copy:hover { border-color: rgba(255,255,255,0.35); color: #ffffff; }
    .btn-copy.copied { color: #4ADE80; border-color: rgba(74,222,128,0.5); }

    .url-line {
      font-size: 12px;
      color: rgba(255,255,255,0.45);
      text-align: center;
    }
    .url-line strong {
      color: #ffffff;
      font-family: "SFMono-Regular", "SF Mono", Menlo, Monaco, Consolas, monospace;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.12);
      border-top-color: #4ADE80;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      color: rgba(255,255,255,0.55);
      font-size: 13px;
    }

    .timer {
      font-size: 12px;
      color: rgba(255,255,255,0.4);
    }
    .timer.urgent { color: #F87171; }

    .success-icon {
      font-size: 36px;
      line-height: 1;
      color: #4ADE80;
    }

    .error-msg {
      font-size: 13px;
      color: #F87171;
      text-align: center;
      background: rgba(248,113,113,0.08);
      border: 1px solid rgba(248,113,113,0.2);
      border-radius: 12px;
      padding: 10px 16px;
      width: 100%;
    }

    .btn-primary {
      background: #4ADE80;
      color: #000000;
      border: none;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      padding: 8px 20px;
      cursor: pointer;
      width: 100%;
      transition: background 0.15s, box-shadow 0.15s;
      -webkit-app-region: no-drag;
    }
    .btn-primary:hover { background: #6EE79A; box-shadow: 0 0 12px rgba(74,222,128,0.35); }

    .btn-ghost {
      background: transparent;
      color: rgba(255,255,255,0.45);
      border: none;
      font-size: 12px;
      cursor: pointer;
      padding: 4px 0;
      -webkit-app-region: no-drag;
    }
    .btn-ghost:hover { color: #ffffff; }

    .divider { width: 100%; height: 1px; background: rgba(255,255,255,0.08); }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <svg class="logo-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
        <defs>
          <linearGradient id="a" x1="0" y1="24" x2="0" y2="488" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#4ADE80"/>
            <stop offset="100%" stop-color="#16A34A"/>
          </linearGradient>
        </defs>
        <rect x="24" y="24" width="464" height="464" rx="104" ry="104" fill="url(#a)"/>
        <rect x="149" y="114" width="58" height="292" rx="6" fill="white"/>
        <rect x="149" y="114" width="228" height="55" rx="6" fill="white"/>
        <rect x="149" y="258" width="172" height="48" rx="6" fill="white"/>
        <path transform="translate(388,122)" fill="white" opacity="0.90"
          d="M0,-18 C2.2,-5.8 5.8,-2.2 18,0 C5.8,2.2 2.2,5.8 0,18 C-2.2,5.8 -5.8,2.2 -18,0 C-5.8,-2.2 -2.2,-5.8 0,-18Z"/>
        <path transform="translate(410,100)" fill="white" opacity="0.55"
          d="M0,-9 C1.1,-2.9 2.9,-1.1 9,0 C2.9,1.1 1.1,2.9 0,9 C-1.1,2.9 -2.9,1.1 -9,0 C-2.9,-1.1 -1.1,-2.9 0,-9Z"/>
      </svg>
      <span class="logo-wordmark">Forge OS</span>
    </div>

    <!-- Waiting screen -->
    <div class="screen active" id="screen-waiting">
      <div style="display:contents" id="waiting-content">
        <h1>Connect GitHub Account</h1>
        <p class="instruction">Enter the code below at GitHub to authorize:</p>

        <div class="code-block">
          <span class="code-value" id="user-code">····-····</span>
          <button class="btn-copy" id="btn-copy">Copy</button>
        </div>

        <p class="url-line">
          Go to <strong>github.com/activate</strong> in your browser
        </p>

        <div class="status-row">
          <div class="spinner" id="spinner"></div>
          <span id="status-text">Waiting for authorization…</span>
        </div>

        <div class="timer" id="timer"></div>

        <div class="divider"></div>
        <button class="btn-ghost" id="btn-cancel">Cancel</button>
      </div>
    </div>

    <!-- Success screen -->
    <div class="screen" id="screen-success">
      <div style="display:flex;flex-direction:column;align-items:center;gap:16px;width:100%">
        <div class="success-icon">✓</div>
        <h1>Connected!</h1>
        <p class="instruction">Your GitHub account is linked. Forge OS is starting…</p>
      </div>
    </div>

    <!-- Error screen -->
    <div class="screen" id="screen-error">
      <div style="display:flex;flex-direction:column;align-items:center;gap:16px;width:100%">
        <h1>Authorization Failed</h1>
        <div class="error-msg" id="error-msg"></div>
        <button class="btn-primary" id="btn-retry">Try Again</button>
        <button class="btn-ghost" id="btn-cancel-error">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    // Add mac class so CSS can compensate for hiddenInset traffic lights
    if (navigator.platform.toLowerCase().startsWith('mac') || navigator.userAgent.includes('Mac')) {
      document.documentElement.classList.add('mac')
    }
  </script>
  <script>
    const screens = {
      waiting: document.getElementById('screen-waiting'),
      success: document.getElementById('screen-success'),
      error: document.getElementById('screen-error')
    }

    function showScreen(name) {
      Object.values(screens).forEach(s => s.classList.remove('active'))
      screens[name].classList.add('active')
    }

    // Countdown timer
    let timerInterval = null
    function startTimer(expiresInSec) {
      const el = document.getElementById('timer')
      const end = Date.now() + expiresInSec * 1000
      clearInterval(timerInterval)
      timerInterval = setInterval(() => {
        const remaining = Math.max(0, Math.round((end - Date.now()) / 1000))
        const m = Math.floor(remaining / 60)
        const s = remaining % 60
        el.textContent = `Code expires in ${m}:${s.toString().padStart(2, '0')}`
        el.classList.toggle('urgent', remaining < 60)
        if (remaining === 0) clearInterval(timerInterval)
      }, 500)
    }

    // Button listeners registered unconditionally — callbacks reference electronAPI
    // lazily (only invoked on click, always in Electron context at that point).
    document.getElementById('btn-copy').addEventListener('click', () => {
      window.electronAPI?.copyCode()
      const btn = document.getElementById('btn-copy')
      btn.textContent = 'Copied!'
      btn.classList.add('copied')
      setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied') }, 2000)
    })
    document.getElementById('btn-cancel').addEventListener('click', () => window.electronAPI?.cancel())
    document.getElementById('btn-cancel-error').addEventListener('click', () => window.electronAPI?.cancel())
    document.getElementById('btn-retry').addEventListener('click', () => window.electronAPI?.retry())

    // IPC status handler — only available in Electron context.
    if (window.electronAPI) {
      window.electronAPI.onAuthStatus(({ state, code, url, expiresIn, message }) => {
        if (state === 'waiting') {
          document.getElementById('user-code').textContent = code
          if (expiresIn) startTimer(expiresIn)
          showScreen('waiting')
        } else if (state === 'success') {
          clearInterval(timerInterval)
          showScreen('success')
        } else if (state === 'error') {
          clearInterval(timerInterval)
          document.getElementById('error-msg').textContent = message
          showScreen('error')
        }
      })
    }
  </script>
</body>
</html>
